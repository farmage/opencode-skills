name: Publish v0.5.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.5.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build release notes
        run: |
          awk '
            /^## \[0\.5\.0\]/ { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release edit v0.5.0 \
              --title "v0.5.0 — OpenCode Skills" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create v0.5.0 \
              --target "$GITHUB_SHA" \
              --title "v0.5.0 — OpenCode Skills" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
