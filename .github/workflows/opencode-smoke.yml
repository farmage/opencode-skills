name: OpenCode Smoke Test

on:
  push:
    branches:
      - "sync/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  opencode-skills:
    name: OpenCode loads all skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install OpenCode
        run: |
          npm install --global @opencode/cli
          opencode --version

      - name: Verify project skill tree
        run: |
          test "$(find .opencode/skills -name SKILL.md -type f | wc -l)" -eq 67
          test -f .opencode/skills/django-storages-s3/SKILL.md

      - name: Start OpenCode server
        env:
          OPENCODE_SERVER_PASSWORD: ci-smoke-password
        run: |
          opencode serve --hostname 127.0.0.1 --port 4096 > /tmp/opencode.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS -u opencode:ci-smoke-password http://127.0.0.1:4096/global/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/opencode.log
          exit 1

      - name: Verify OpenCode advertises all skills
        env:
          OPENCODE_SERVER_PASSWORD: ci-smoke-password
        run: |
          PROVIDERS="$(curl -fsS -u opencode:ci-smoke-password http://127.0.0.1:4096/provider)"
          echo "$PROVIDERS" | jq '{connected, providerCount: (.all | length)}'

          PROVIDER="$(echo "$PROVIDERS" | jq -r '.all[] | select((.models | length) > 0) | .id' | head -1)"
          MODEL="$(echo "$PROVIDERS" | jq -r --arg p "$PROVIDER" '.all[] | select(.id == $p) | .models | keys[0]')"
          test -n "$PROVIDER"
          test -n "$MODEL"

          TOOLS="$(curl -fsS -u opencode:ci-smoke-password \
            --get \
            --data-urlencode "provider=$PROVIDER" \
            --data-urlencode "model=$MODEL" \
            http://127.0.0.1:4096/experimental/tool)"

          SKILL_DESC="$(echo "$TOOLS" | jq -r '.. | objects | select(.id? == "skill") | .description? // empty' | head -1)"
          test -n "$SKILL_DESC"

          printf '%s\n' "$SKILL_DESC" > /tmp/skill-description.txt
          cat /tmp/skill-description.txt

          COUNT="$(grep -c '<skill>' /tmp/skill-description.txt || true)"
          test "$COUNT" -eq 67
          grep -q '<name>django-storages-s3</name>' /tmp/skill-description.txt
          grep -q '<name>prompt-engineer</name>' /tmp/skill-description.txt
          grep -q '<name>csharp-developer</name>' /tmp/skill-description.txt

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/opencode.log || true
