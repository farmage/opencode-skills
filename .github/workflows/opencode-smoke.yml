name: OpenCode Smoke Test

on:
  push:
    branches:
      - "sync/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  opencode-skills:
    name: OpenCode loads all skills
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install OpenCode
        run: |
          npm install --global @opencode/cli
          opencode --version

      - name: Verify project skill tree
        run: |
          test "$(find .opencode/skills -name SKILL.md -type f | wc -l)" -eq 67
          test -f .opencode/skills/django-storages-s3/SKILL.md

      - name: Verify OpenCode discovers all skills
        run: |
          opencode debug skill > /tmp/skills.json
          jq . /tmp/skills.json

          COUNT="$(jq 'length' /tmp/skills.json)"
          test "$COUNT" -eq 67

          jq -e '.[] | select(.name == "django-storages-s3")' /tmp/skills.json >/dev/null
          jq -e '.[] | select(.name == "prompt-engineer")' /tmp/skills.json >/dev/null
          jq -e '.[] | select(.name == "csharp-developer")' /tmp/skills.json >/dev/null
